<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hostel Management System — Review Student Complaints" />
  <title>Complaints — Hostel Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-brand">🏠 Hostel Manager</div>
  <div class="navbar-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="rooms.html">Rooms</a>
    <a href="complaints.html" class="active">Complaints</a>
    <a href="leaves.html">Leaves</a>
    <a href="visitors.html">Visitors</a>
    <a href="fees.html">Fees</a>
  </div>
  <div class="user-badge">
    <div class="user-avatar" id="user-avatar">A</div>
    <span id="user-name">Admin</span>
    <button class="btn btn-ghost" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- Content -->
<div class="container">
  <div class="section-header">
    <h1>Student Complaints</h1>
  </div>

  <!-- Complaints Section -->
  <div id="section-complaints">
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Grievances</h3>
        <div class="value" id="stat-total-complaints">-</div>
        <div class="stat-desc">All time submitted</div>
      </div>
      <div class="stat-card">
        <h3>Pending Review</h3>
        <div class="value" id="stat-pending-complaints" style="color: var(--danger);">-</div>
        <div class="stat-desc">Awaiting Warden response</div>
      </div>
      <div class="stat-card">
        <h3>In Progress</h3>
        <div class="value" id="stat-progress-complaints" style="color: var(--warning);">-</div>
        <div class="stat-desc">Work scheduled</div>
      </div>
      <div class="stat-card">
        <h3>Resolved</h3>
        <div class="value" id="stat-resolved-complaints" style="color: var(--success);">-</div>
        <div class="stat-desc">Closed cases</div>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
        <h2>Complaints Ledger</h2>
        <!-- Filters -->
        <div class="tab-toggle" style="margin-bottom:0; font-size:0.8rem;">
          <button id="filter-c-all" class="active" onclick="filterComplaints('All')" style="padding:6px 12px;">All</button>
          <button id="filter-c-pending" onclick="filterComplaints('Pending')" style="padding:6px 12px;">Pending</button>
          <button id="filter-c-inprogress" onclick="filterComplaints('In Progress')" style="padding:6px 12px;">In Progress</button>
          <button id="filter-c-resolved" onclick="filterComplaints('Resolved')" style="padding:6px 12px;">Resolved</button>
        </div>
      </div>
      
      <div id="complaints-table-area">
        <div class="empty-state">
          <p>Loading complaints...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaves Section -->
  <!-- REMOVED: Leaves management moved to dedicated leaves.html page -->

</div>

<script>
  const API = "http://localhost:3000";
  let complaintsList = [];
  let activeComplaintsFilter = "All";


  // Auth guard
  const userData = localStorage.getItem("hostel_user");
  if (!userData) {
    window.location.href = "login.html";
  } else {
    const user = JSON.parse(userData);
    if (user.role !== "admin") {
      if (user.role === "student") {
        window.location.href = "student-dashboard.html";
      } else {
        localStorage.removeItem("hostel_user");
        window.location.href = "login.html";
      }
    } else {
      document.getElementById("user-name").textContent = user.username;
      document.getElementById("user-avatar").textContent = user.username.charAt(0).toUpperCase();
    }
  }

  function logout() {
    localStorage.removeItem("hostel_user");
    window.location.href = "login.html";
  }

  // ---- COMPLAINTS MODULE ----
  async function loadComplaints() {
    try {
      const res = await fetch(API + "/complaints");
      const data = await res.json();
      if (data.success) {
        complaintsList = data.data;
        updateComplaintsStats();
        renderComplaints();
      }
    } catch (err) {
      console.error(err);
    }
  }

  function updateComplaintsStats() {
    document.getElementById("stat-total-complaints").textContent = complaintsList.length;
    document.getElementById("stat-pending-complaints").textContent = complaintsList.filter(c => c.status === "Pending").length;
    document.getElementById("stat-progress-complaints").textContent = complaintsList.filter(c => c.status === "In Progress").length;
    document.getElementById("stat-resolved-complaints").textContent = complaintsList.filter(c => c.status === "Resolved").length;
  }

  function filterComplaints(status) {
    activeComplaintsFilter = status;
    document.getElementById("filter-c-all").classList.toggle("active", status === "All");
    document.getElementById("filter-c-pending").classList.toggle("active", status === "Pending");
    document.getElementById("filter-c-inprogress").classList.toggle("active", status === "In Progress");
    document.getElementById("filter-c-resolved").classList.toggle("active", status === "Resolved");
    renderComplaints();
  }

  function renderComplaints() {
    const filtered = activeComplaintsFilter === "All"
      ? complaintsList
      : complaintsList.filter(c => c.status === activeComplaintsFilter);

    const area = document.getElementById("complaints-table-area");
    if (filtered.length === 0) {
      area.innerHTML = `<div class="empty-state"><p>No complaints found matching "${activeComplaintsFilter}"</p></div>`;
      return;
    }

    let html = `<div class="table-wrapper"><table>
      <thead><tr>
        <th>Date</th><th>Student</th><th>Room</th><th>Description</th><th>Status</th><th>Actions</th>
      </tr></thead><tbody>`;

    filtered.forEach(c => {
      let badge = "badge-outline";
      if (c.status === "Pending") badge += " badge-outline-danger";
      else if (c.status === "In Progress") badge += " badge-outline-warning";
      else if (c.status === "Resolved") badge += " badge-outline-success";

      html += `<tr>
        <td>${new Date(c.date).toLocaleDateString("en-IN")}</td>
        <td><strong>${escapeHTML(c.student_name)}</strong></td>
        <td><span class="badge-outline">${escapeHTML(String(c.room_no))}</span></td>
        <td>${escapeHTML(c.description)}</td>
        <td><span class="${badge}">${c.status}</span></td>
        <td class="actions">
          ${c.status === "Pending" ? `<button class="btn btn-outline" onclick="updateComplaintStatus(${c.id}, 'In Progress')">Schedule</button>` : ""}
          ${c.status !== "Resolved" ? `<button class="btn btn-primary" onclick="updateComplaintStatus(${c.id}, 'Resolved')" style="padding:6px 12px; font-size:0.8rem; width:auto;">Resolve</button>` : `<span style="color:var(--success); font-weight:600;">✓ Resolved</span>`}
        </td>
      </tr>`;
    });
    html += "</tbody></table></div>";
    area.innerHTML = html;
  }

  async function updateComplaintStatus(id, status) {
    try {
      const res = await fetch(API + `/complaints/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      const data = await res.json();
      if (data.success) {
        showToast("Complaint status updated", "success");
        loadComplaints();
      }
    } catch (err) {
      showToast("Server error", "error");
    }
  }

  // Helpers
  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function showToast(message, type) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    const toast = document.createElement("div");
    toast.className = "toast toast-" + type;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // Load complaints initially
  loadComplaints();
</script>
</body>
</html>
